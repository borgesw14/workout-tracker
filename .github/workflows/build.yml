name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee build.log
      - name: Surface build errors
        if: failure()
        run: |
          grep -E -A8 '^e: |What went wrong|error:' build.log | head -60 | while IFS= read -r line; do
            echo "::error::$line"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: workout-tracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
