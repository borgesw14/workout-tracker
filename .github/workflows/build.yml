name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee build.log
      - name: Check database migrations match Room's schema
        run: |
          # Every CREATE statement Room generates for a table added after v1 must appear verbatim in Migrations.kt.
          gen=$(grep -rhoE 'CREATE (TABLE|INDEX) IF NOT EXISTS `(index_)?SessionExercise[^"]*' app/build/generated/ksp)
          test -n "$gen"
          while IFS= read -r stmt; do
            if ! grep -qF "$stmt" app/src/main/java/app/workouttracker/data/Migrations.kt; then
              echo "::error title=Migration mismatch::Room expects: $stmt"
              exit 1
            fi
          done <<< "$gen"
      - name: Surface build errors
        if: failure()
        run: |
          # One annotation holding the first errors, since GitHub caps annotations per step.
          msg=$(grep -E -A8 '^e: |What went wrong|error:' build.log | head -60 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build errors::$msg"
      - uses: actions/upload-artifact@v4
        with:
          name: workout-tracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to the "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk workout-tracker.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest workout-tracker.apk --title "Latest build" --notes "Built from ${GITHUB_SHA::7}." --target "$GITHUB_SHA"
